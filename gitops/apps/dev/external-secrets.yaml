# Syncs Secrets Manager entries into Kubernetes Secrets, so no secret value
# ever lives in Git. AWS permissions come from Pod Identity
# (external-secrets/external-secrets), limited to agentic-sre-dev/* secrets.
#
# Webhook and cert-controller are off: they only validate ExternalSecret
# objects, and a self-managed webhook cert is exactly the kind of thing Argo
# CD fights (see CLAUDE.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      valuesObject:
        serviceAccount:
          name: external-secrets
        webhook:
          create: false
        certController:
          create: false
        serviceMonitor:
          enabled: true
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo CD doesn't retry a failed automated sync for the same commit on
    # its own; on a fresh cluster transient failures (a CRD or webhook not
    # ready yet) would otherwise leave the app stuck.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
