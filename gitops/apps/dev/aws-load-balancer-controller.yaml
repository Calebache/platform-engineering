# Provisions the internet-facing NLB in front of Envoy Gateway. AWS
# permissions come from Pod Identity (kube-system/aws-load-balancer-controller,
# created by Terraform), so no role annotation is needed.
#
# Wave 0, after cert-manager: its webhook certificate comes from cert-manager.
# The chart's default self-signed cert is regenerated on every Argo CD render,
# which briefly breaks the webhook after each sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.5.0
    helm:
      valuesObject:
        clusterName: agentic-sre-dev
        region: ca-central-1
        # Look the VPC up by tag: its ID changes every time the disposable
        # environment is recreated.
        vpcTags:
          Name: agentic-sre-dev
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
        enableCertManager: true
        # The mutator intercepts every Service created in the cluster, so any
        # controller hiccup blocks unrelated workloads. Envoy's Service sets
        # loadBalancerClass itself (EnvoyProxy "nlb"), so the mutator isn't needed.
        enableServiceMutatorWebhook: false
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo CD doesn't retry a failed automated sync for the same commit on
    # its own; on a fresh cluster transient failures (a CRD or webhook not
    # ready yet) would otherwise leave the app stuck.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
