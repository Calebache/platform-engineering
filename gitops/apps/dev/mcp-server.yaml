# The governed tool gateway between the SRE agent and the platform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Calebache/platform-engineering.git
    targetRevision: main
    path: gitops/workloads/dev/mcp-server
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
