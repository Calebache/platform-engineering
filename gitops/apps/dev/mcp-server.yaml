# The governed tool gateway between the SRE agent and the platform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Calebache/platform-engineering.git
    targetRevision: main
    path: gitops/workloads/dev/mcp-server
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo CD doesn't retry a failed automated sync for the same commit on
    # its own; on a fresh cluster transient failures (a CRD or webhook not
    # ready yet) would otherwise leave the app stuck.
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
