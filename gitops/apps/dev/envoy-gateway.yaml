# Envoy Gateway: the Gateway API implementation (replaces the retired
# ingress-nginx). Also installs the Gateway API CRDs, which cert-manager and
# external-dns need at startup, hence the early wave.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.9.2
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Gateway API CRDs exceed the client-side apply annotation size limit.
      - ServerSideApply=true
