# Synced by the root Application (created by Terraform) from gitops/apps/dev.
# Every child Application added here should:
#   - use project: platform
#   - set an argocd.argoproj.io/sync-wave (see CLAUDE.md for the wave order)
#   - carry the resources-finalizer.argocd.argoproj.io finalizer, so that
#     `terraform destroy` deleting the root app cascades all the way down
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform components and workloads for the agentic SRE PoC.
  # Deny by default: only these sources can be deployed. Add a chart repo here
  # in the same change that introduces its Application.
  sourceRepos:
    - https://github.com/Calebache/platform-engineering.git
    - https://kubernetes.github.io/autoscaler
    - https://aws.github.io/eks-charts
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns
    - docker.io/envoyproxy
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
