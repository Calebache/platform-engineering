apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sre-agent
  namespace: sre-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-agent-orchestrator
  endpoints:
    - port: metrics
      interval: 30s
      # sre_agent_incidents carries the *affected* service in its `service`
      # label. Without this, Prometheus overwrites it with the scraped
      # Kubernetes Service ("sre-agent") and alerts name the wrong service.
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-agent
  namespace: sre-agent
spec:
  groups:
    - name: sre-agent
      rules:
        # The escalation channel: the agent finished an incident without
        # resolving it. The hypothesis is in the audit record and in the
        # Job's termination message.
        - alert: SreAgentEscalation
          expr: sum by (service, outcome) (sre_agent_incidents{outcome=~"escalated|failed|not_recovered|approval_timeout|pr_rejected|deadline_exceeded|unknown"}) > 0
          labels:
            severity: warning
          annotations:
            summary: "SRE agent needs a human for {{ $labels.service }} ({{ $labels.outcome }})"
            description: >-
              An incident Job ended as {{ $labels.outcome }}. Read the audit
              record in S3 (audit/<date>/<incident-id>.json) or
              `kubectl -n sre-agent get jobs` and the pod's termination message.
        - alert: SreAgentOrchestratorDown
          expr: absent(up{namespace="sre-agent", service="sre-agent"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The SRE agent orchestrator is down; alerts aren't being investigated
