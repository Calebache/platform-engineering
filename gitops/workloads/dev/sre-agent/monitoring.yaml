apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sre-agent
  namespace: sre-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-agent-orchestrator
  endpoints:
    - port: metrics
      interval: 30s
      # sre_agent_incidents carries the *affected* service in its `service`
      # label. Without this, Prometheus overwrites it with the scraped
      # Kubernetes Service ("sre-agent") and alerts name the wrong service.
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sre-agent
  namespace: sre-agent
spec:
  groups:
    - name: sre-agent
      rules:
        # The escalation channel: the agent finished an incident without
        # resolving it. One alert per incident (sre_agent_incident_info has
        # one series per finished Job, for 24h), routed to humans by the
        # sre-agent-humans AlertmanagerConfig (gitops/platform/dev/), never
        # back to the agent. The hypothesis label is sanitised and capped at
        # 200 characters by the orchestrator; the full record is in S3.
        - alert: SreAgentEscalation
          expr: max by (service, alert, outcome, incident_id, hypothesis) (sre_agent_incident_info{outcome=~"escalated|failed|not_recovered|approval_timeout|pr_rejected|deadline_exceeded|unknown"}) > 0
          labels:
            severity: warning
          annotations:
            summary: "SRE agent needs a human: {{ $labels.incident_id }} on {{ $labels.service }} ended {{ $labels.outcome }}"
            description: >-
              {{ $labels.alert }} on {{ $labels.service }} ended as {{ $labels.outcome }}.
              Hypothesis: {{ if $labels.hypothesis }}{{ $labels.hypothesis }}{{ else }}none recorded{{ end }}
            audit: 's3://agentic-sre-dev-audit-103544553431/{{ reReplaceAll "^inc-(....)(..)(..)-.*$" "audit/$1/$2/$3/" $labels.incident_id }}{{ $labels.incident_id }}.json'
            dashboard: "kubectl -n sre-agent port-forward svc/sre-dashboard 8088:80, then http://localhost:8088/incidents/{{ $labels.incident_id }}"
        - alert: SreAgentOrchestratorDown
          expr: absent(up{namespace="sre-agent", service="sre-agent"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The SRE agent orchestrator is down; alerts aren't being investigated
