# The SRE agent's namespace and its two identities:
#
#   sre-agent               the incident worker. The only identity the MCP
#                           server's policy accepts, and bound by Terraform
#                           (Pod Identity) to a role allowing one Bedrock
#                           model (Opus 4.6) and PutObject on audit/*. No
#                           Kubernetes RBAC.
#   sre-agent-orchestrator  receives webhooks and creates incident Jobs. No
#                           AWS role, no model access, no MCP access.
apiVersion: v1
kind: Namespace
metadata:
  name: sre-agent
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: sre-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-orchestrator
  namespace: sre-agent
