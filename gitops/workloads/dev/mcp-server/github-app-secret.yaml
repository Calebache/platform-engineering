# The MCP server's GitHub App (Contents + Pull requests: read/write on this
# repo only), stored with `PROFILE=mcp scripts/store-github-app.sh`. Only the
# MCP server holds it; the agent never sees a GitHub credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-server-github-app
  namespace: mcp-server
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: mcp-server-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef: { key: agentic-sre-dev/mcp-server/github-app, property: appId }
    - secretKey: installation-id
      remoteRef: { key: agentic-sre-dev/mcp-server/github-app, property: installationId }
    - secretKey: private-key
      remoteRef: { key: agentic-sre-dev/mcp-server/github-app, property: privateKey }
