# The MCP server's own Kubernetes permissions: read-only, never Secrets, and
# only in the namespaces of services it serves (bound per namespace, not
# cluster-wide). Adding a service means adding a RoleBinding here and the
# service to policy/mcp.rego.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-server-read-workloads
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-server-read
  namespace: payment-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-server-read-workloads
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: mcp-server
---
# Argo CD Application status (sync, health, deployed revisions).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-server-read-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-server-read-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-server-read-applications
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: mcp-server
---
# TokenReview, to authenticate callers. Grants nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: mcp-server
