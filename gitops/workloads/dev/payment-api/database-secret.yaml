# Postgres credentials, generated by Terraform straight into Secrets Manager
# (agentic-sre-dev/payment-api/db). External Secrets materialises them as the
# payment-api-db Secret with keys "username" and "password".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-api-db
  namespace: payment-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: payment-api-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: agentic-sre-dev/payment-api/db
