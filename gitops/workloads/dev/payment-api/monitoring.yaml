apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payment-api
  namespace: payment-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  endpoints:
    - port: metrics
      interval: 15s
---
# The alert that starts the incident workflow (doc.md §11, §13).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: payment-api
  namespace: payment-api
spec:
  groups:
    - name: payment-api
      # Evaluated every 15 s (the scrape interval), not the global 30 s, so
      # the incident starts within about a minute of the first errors.
      interval: 15s
      rules:
        - alert: PaymentApiHighErrorRate
          # 3 or more API responses (health probes excluded) with a 5xx in the
          # last minute, firing at once (no `for`). Tuned for a fast demo: in
          # production you'd alert on an SLO burn rate instead, since every
          # firing starts a (billed) agent investigation. Keep this the only
          # critical error-rate alert: the orchestrator de-duplicates by alert
          # name, so a second one would start a second Job for one outage.
          expr: |
            sum(increase(http_requests_total{namespace="payment-api", service="payment-api", code=~"5..", route!~"GET /(healthz|readyz)"}[1m]))
              >= 3
          labels:
            severity: critical
            service: payment-api
          annotations:
            summary: payment-api returned 3 or more server errors in the last minute
            description: >-
              {{ $value | humanize }} payment-api requests returned HTTP 5xx in
              the last minute.
        - alert: PaymentApiDown
          expr: absent(up{namespace="payment-api", service="payment-api"} == 1)
          for: 2m
          labels:
            severity: critical
            service: payment-api
          annotations:
            summary: No payment-api instance is being scraped successfully
