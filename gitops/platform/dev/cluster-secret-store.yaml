# The one way workloads get secrets: AWS Secrets Manager, read with the
# External Secrets controller's Pod Identity (which IAM limits to
# agentic-sre-dev/*). Deny by default: only the namespaces listed below may
# reference this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ca-central-1
  conditions:
    - namespaces:
        - payment-api
