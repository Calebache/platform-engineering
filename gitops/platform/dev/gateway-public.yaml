# The single public entry point. TLS terminates here with a wildcard
# certificate that cert-manager creates from the annotation below.
#
# Exposure is deny-by-default: an HTTPRoute can attach to the HTTPS listener
# only from a namespace labelled gateway.calebache.com/public=true. App
# namespaces opt in explicitly; external-dns then publishes the route's
# hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy
  listeners:
    # No hostname, so external-dns publishes nothing for it. Only the
    # redirect route below (same namespace) may attach.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.calebache.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-calebache-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.calebache.com/public: "true"
---
# Redirect all plain HTTP to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
