# Intentional failure demo (doc.md §21): this manifest must fail the OPA
# check, in CI (gator) and at admission (Gatekeeper). It lives outside
# gitops/, so nothing ever deploys it.
#
#   gator test -f gitops/policies/dev -f policy/examples/privileged-pod.yaml
#   kubectl apply --dry-run=server -f policy/examples/privileged-pod.yaml   # denied by Gatekeeper
apiVersion: v1
kind: Pod
metadata:
  name: privileged-demo
  # A namespace the enforcing constraints cover.
  namespace: payment-api
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: shell
      image: busybox:1.37.0
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 32Mi
